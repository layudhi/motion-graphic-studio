name: Batubara Swabakar final MP4 and SRT
on:
  pull_request:
    paths:
      - ".github/workflows/swabakar-final-render.yml"
      - "scripts/align_swabakar_subtitles.py"
      - "projects/batubara-swabakar/**"
      - "src/Root.tsx"
      - "public/audio/VO_Batubara_Swabakar.wav"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Remotion dependencies
        run: npm ci
      - name: TypeScript / lint check
        run: |
          npx tsc --noEmit
          npx eslint projects/batubara-swabakar/BatubaraSwabakar.tsx projects/batubara-swabakar/MonitoringScenes.tsx
      - name: Align new VO and write SRT
        shell: bash
        run: |
          mkdir -p final-deliverables
          python -m pip install --quiet faster-whisper
          if timeout 240s python scripts/align_swabakar_subtitles.py --asr; then
            echo "ASR timing attempted."
          else
            echo "ASR unavailable; using explicitly provisional fallback."
            python scripts/align_swabakar_subtitles.py
          fi
          python .agents/skills/motion-graphic-production-expert/scripts/check_srt.py final-deliverables/BatubaraSwabakar.srt
          python scripts/inspect_swabakar_wav.py | tee final-deliverables/vo-metadata.txt
      - name: Render approved MP4
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then BROWSER_ARGS=("--browser-executable=$CHROME"); else BROWSER_ARGS=(); fi
          npx remotion render src/index.ts BatubaraSwabakar final-deliverables/BatubaraSwabakar_Final.mp4 --codec=h264 --crf=18 --concurrency=2 "${BROWSER_ARGS[@]}"
          for f in 60 420 885 1165 1237; do
            npx remotion still src/index.ts BatubaraSwabakar "final-deliverables/frame-${f}.png" --frame="$f" "${BROWSER_ARGS[@]}"
          done
      - name: Verify media
        shell: bash
        run: |
          ffprobe -v error -show_format -show_streams -of json final-deliverables/BatubaraSwabakar_Final.mp4 > final-deliverables/media-probe.json
          python -c 'import json; d=json.load(open("final-deliverables/media-probe.json")); s=d["streams"]; v=next(x for x in s if x["codec_type"]=="video"); assert v["width"]==1080 and v["height"]==1920 and v["codec_name"]=="h264" and v["avg_frame_rate"]=="30/1"; assert any(x["codec_type"]=="audio" for x in s), "Missing VO track"; dur=float(d["format"]["duration"]); assert 41.30<dur<41.55, dur; print("PASS",dur)'
      - name: Upload final video, SRT and QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BatubaraSwabakar-Final-Delivery
          path: final-deliverables/
          retention-days: 14
          if-no-files-found: warn
